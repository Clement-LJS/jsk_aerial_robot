aerial_robot_control_name: aerial_robot_control/gimbalrotor_perching_impedance_controller

controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : true
  wrench_estimate_flag : true

  xy:
    p_gain: 10.0
    i_gain: 0.2
    d_gain: 5.0
    limit_sum: 4.0
    limit_p: 12.0
    limit_i: 5.0
    limit_d: 12.0

  z:
    p_gain: 8.0
    i_gain: 1.5
    d_gain: 5.0
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 20.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll:
    p_gain: 17.0
    i_gain: 5.0
    d_gain: 12.0
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0

  pitch:
    p_gain: 17.0
    i_gain: 5.0
    d_gain: 12.0
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0

    start_rp_integration_height: 0.01

  yaw:
    p_gain: 15.0
    i_gain: 1.0
    d_gain: 10.0
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 5.0
    limit_d: 20.0

    need_d_control: true

  impedance:
    use_impedance: true

    impedance_enable_topic: perching/enable
    external_wrench_topic: estimated_external_wrench

    external_wrench_frame: world
    compliance_frame: world

    force_lpf_alpha: 0.2
    torque_lpf_alpha: 0.2

    enable_x: 0
    enable_y: 0
    enable_z: 0

    enable_roll: 0
    enable_pitch: 1
    enable_yaw: 0

    force_ref_x: 0.0
    force_ref_y: 0.0
    force_ref_z: 0.0

    torque_ref_roll: 0.0
    torque_ref_pitch: 0.0
    torque_ref_yaw: 0.0

    mass_x: 5.0
    mass_y: 5.0
    mass_z: 5.0

    damping_x: 50.0
    damping_y: 50.0
    damping_z: 50.0

    stiffness_x: 100.0
    stiffness_y: 100.0
    stiffness_z: 100.0

    inertia_roll: 0.08
    inertia_pitch: 0.08
    inertia_yaw: 0.08

    rot_damping_roll: 0.5
    rot_damping_pitch: 0.5
    rot_damping_yaw: 0.5

    rot_stiffness_roll: 1.0
    rot_stiffness_pitch: 1.0
    rot_stiffness_yaw: 1.0

    force_limit_x: 0.0
    force_limit_y: 0.0
    force_limit_z: 0.0

    torque_limit_roll: 0.0
    torque_limit_pitch: 0.2
    torque_limit_yaw: 0.0

    pos_offset_limit_x: 0.0
    pos_offset_limit_y: 0.0
    pos_offset_limit_z: 0.0

    vel_offset_limit_x: 0.0
    vel_offset_limit_y: 0.0
    vel_offset_limit_z: 0.0

    angle_offset_limit_roll: 0.0
    angle_offset_limit_pitch: 0.05236
    angle_offset_limit_yaw: 0.0

    angular_vel_offset_limit_roll: 0.0
    angular_vel_offset_limit_pitch: 0.3
    angular_vel_offset_limit_yaw: 0.0

    perching:
      # These topics must match GimbalrotorPerchingNavigator.
      perching_enable_topic: perching/enable
      perching_point_topic: perching/point
      perching_branch_pose_topic: perching/branch_pose
      perching_locked_pose_topic: perching/locked_pose

      # If /perching/point is not published, use branch pose as the pivot.
      use_branch_pose_if_no_point: true

      # Only use perching-constrained impedance after the perching navigator has locked.
      # If not locked yet, this controller falls back to normal impedance.
      require_perching_lock: true

      # These should match your navigation parameters.
      # If omitted, the controller also tries to read them from navigation.
      perching_min_valid_radius: 0.05
      perching_max_pitch_delta: 0.78539816339
      perching_arc_pitch_sign: 1.0