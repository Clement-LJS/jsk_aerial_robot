aerial_robot_control_name: aerial_robot_control/gimbalrotor_impedance_controller

controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : true
  wrench_estimate_flag : true

  compensate_multilink_inertia: true
  inertia_dot_lpf_rate: 0.15
  nonlinear_ang_acc_limit: 5.0

  xy:
    p_gain: 10.0
    i_gain: 0.2
    d_gain: 5.0
    limit_sum: 4.0
    limit_p: 12.0
    limit_i: 5.0
    limit_d: 12.0

  z:
    p_gain: 8.0
    i_gain: 1.5
    d_gain: 5.0
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 20.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll:
    p_gain: 17.0
    i_gain: 5.0
    d_gain: 12.0
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0

  pitch:
    p_gain: 17.0
    i_gain: 5.0
    d_gain: 12.0
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0

    start_rp_integration_height: 0.01

  yaw:
    p_gain: 15.0
    i_gain: 1.0
    d_gain: 10.0
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 5.0
    limit_d: 20.0

    need_d_control: true

  impedance:
    use_impedance: true

    external_wrench_topic: estimated_external_wrench
    is_cutting_topic: isCutting

    # Use "world" if estimated_external_wrench is already world frame.
    # Use "cog" if the wrench is body/CoG frame.
    external_wrench_frame: world

    # Start with saw frame.
    tool_link_name: saw

    # Keep zero first.
    # Later adjust if tool-X is not the feed direction.
    tool_frame_roll: 0.0
    tool_frame_pitch: 0.0
    tool_frame_yaw: 0.0

    # For first test, make this small.
    # If you command the target manually while cutting and override is always 1,
    # increase this slightly later.
    target_override_threshold: 0.03

    # First test: ONLY feed-axis compliance.
    # Do not enable Y/Z yet.
    axis_enable_x: 1.0
    axis_enable_y: 0.0
    axis_enable_z: 0.0

    # Tool-X / feed axis
    # Very safe: high damping, small displacement, slow velocity.
    mass_x: 8.0
    damping_x: 80.0
    stiffness_x: 80.0
    force_ref_x: 0.0
    force_limit_x: 0.5
    displacement_limit_x: 0.010
    velocity_limit_x: 0.020

    # Tool-Y / lateral axis disabled
    mass_y: 8.0
    damping_y: 120.0
    stiffness_y: 200.0
    force_ref_y: 0.0
    force_limit_y: 0.5
    displacement_limit_y: 0.003
    velocity_limit_y: 0.010

    # Tool-Z / normal axis disabled
    mass_z: 8.0
    damping_z: 120.0
    stiffness_z: 200.0
    force_ref_z: 0.0
    force_limit_z: 0.5
    displacement_limit_z: 0.003
    velocity_limit_z: 0.010

    # Strong smoothing for first test.
    force_lpf_alpha: 0.1