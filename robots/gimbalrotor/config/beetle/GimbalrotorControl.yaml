aerial_robot_control_name: aerial_robot_control/gimbalrotor_controller

controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : true
  wrench_estimate_flag : true

  x:
    p_gain: 10.0
    i_gain: 0.2
    d_gain: 7.0 #10.0
    limit_sum: 4.0
    limit_p: 12.0
    limit_i: 5.0
    limit_d: 12.0

  y:
    p_gain: 10.0
    i_gain: 0.2 #0.0
    d_gain: 9.5 #11.0
    limit_sum: 4.0
    limit_p: 12.0
    limit_i: 5.0
    limit_d: 12.0

  z:
    p_gain: 18.0
    i_gain: 4.0
    d_gain: 6.0
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 20.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll:
    p_gain: 25.0
    i_gain: 0.4 #2.0 # or 0.3
    d_gain: 18.0
    limit_sum: 20.0
    limit_p: 22.0
    limit_i: 5.0 # 0.6
    limit_d: 20.0

    start_rp_integration_height: 0.01

  pitch:
    p_gain: 15.0
    i_gain: 3.0
    d_gain: 7.0
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 15.0
    limit_d: 20.0

    start_rp_integration_height: 0.01

  yaw:
    p_gain: 15.0
    i_gain: 1.0
    d_gain: 6.0
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 5.0
    limit_d: 20.0

    need_d_control: true
