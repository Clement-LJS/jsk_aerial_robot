aerial_robot_control_name: aerial_robot_control/gimbalrotor_perching_admittance_controller

controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : true
  wrench_estimate_flag : true

  xy:
    p_gain: 10.0
    i_gain: 0.2
    d_gain: 7.0
    limit_sum: 4.0
    limit_p: 12.0
    limit_i: 5.0
    limit_d: 12.0

  z:
    p_gain: 10.0
    i_gain: 2.0
    d_gain: 5.0
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 20.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll:
    p_gain: 17.0
    i_gain: 0.5 # or 0.3
    d_gain: 14.0
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 0.6
    limit_d: 20.0

  pitch:
    p_gain: 15.0
    i_gain: 3.0
    d_gain: 7.0
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0

    start_rp_integration_height: 0.15

  yaw:
    p_gain: 15.0
    i_gain: 1.0
    d_gain: 8.0
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 5.0
    limit_d: 20.0

    need_d_control: true

  admittance:
    use_admittance: true
    external_wrench_timeout: 0.15

    # Maximum valid AdmittanceCore integration interval.
    # The normal controller is approximately 40 Hz, so 0.10 s
    # provides margin while rejecting large control gaps.
    max_dt: 0.10

    admittance_enable_topic: admittance_enable

    external_wrench_topic: estimated_external_wrench

    external_wrench_frame: world
    compliance_frame: world

    force_lpf_alpha: 0.15
    torque_lpf_alpha: 0.10

    # Keep your proven perching test setting.
    # For normal flying admittance in all axes, you can later set x/y/z to 1.
    enable_x: 0
    enable_y: 0
    enable_z: 0

    enable_roll: 0
    enable_pitch: 1
    enable_yaw: 0

    force_ref_x: 0.0
    force_ref_y: 0.0
    force_ref_z: 0.0

    torque_ref_roll: 0.0
    torque_ref_pitch: 0.0
    torque_ref_yaw: 0.0

    mass_x: 5.0
    mass_y: 5.0
    mass_z: 5.0

    damping_x: 50.0
    damping_y: 50.0
    damping_z: 50.0

    stiffness_x: 100.0
    stiffness_y: 100.0
    stiffness_z: 100.0

    inertia_roll: 0.08
    inertia_pitch: 0.20
    inertia_yaw: 0.08

    rot_damping_roll: 0.5
    rot_damping_pitch: 2.0
    rot_damping_yaw: 0.5

    rot_stiffness_roll: 1.0
    rot_stiffness_pitch: 5.0
    rot_stiffness_yaw: 1.0

    force_limit_x: 0.0
    force_limit_y: 0.0
    force_limit_z: 0.0

    torque_limit_roll: 0.0
    torque_limit_pitch: 0.18
    torque_limit_yaw: 0.0

    pos_offset_limit_x: 0.0
    pos_offset_limit_y: 0.0
    pos_offset_limit_z: 0.0

    vel_offset_limit_x: 0.0
    vel_offset_limit_y: 0.0
    vel_offset_limit_z: 0.0

    angle_offset_limit_roll: 0.0
    angle_offset_limit_pitch: 0.0383972
    angle_offset_limit_yaw: 0.0

    angular_vel_offset_limit_roll: 0.0
    angular_vel_offset_limit_pitch: 0.15
    angular_vel_offset_limit_yaw: 0.0

    perching:
      # Perching navigation state.
      # Full topic: /gimbalrotor/perching/enable
      perching_enable_topic: perching/enable

      # Separate perching admittance trigger.
      # Full topic: /gimbalrotor/perching/admittance_enable
      perching_admittance_enable_topic: perching/admittance_enable

      # These topics must match GimbalrotorPerchingNavigator.
      perching_point_topic: perching/point
      perching_branch_pose_topic: perching/branch_pose
      perching_locked_pose_topic: perching/locked_pose
      perching_locked_pivot_topic: perching/locked_pivot

      # Do not use branch mocap as fallback pivot.
      # The navigator publishes locked_pivot from the hand center.
      use_branch_pose_if_no_point: false

      require_perching_lock: true

      perching_min_valid_radius: 0.05
      perching_max_pitch_delta: 0.5235987756
      perching_arc_pitch_sign: 1.0

      # Maximum allowed time difference between the
      # separately published locked pose and pivot.
      maximum_lock_stamp_difference: 0.05

      # Number of controller cycles used to average the
      # no-contact equilibrium pivot wrench.
      #
      # Main controller runs at approximately 40 Hz:
      # 80 samples = approximately 2 seconds.
      equilibrium_wrench_required_samples: 80

      # Hybrid PID-admittance supervisor (perching cutting).
      #
      # When false, the controller reproduces the legacy behavior exactly
      # (admittance active immediately after enable, symmetric compliance,
      # abrupt integral clearing) for regression comparison.
      hybrid:
        enabled: true

        # Full topic: /gimbalrotor/perching/cutting_active
        cutting_active_topic: perching/cutting_active
        require_cutting_active: true

        # All thresholds below are initial test values only.
        # Tune from no-contact and cutting rosbags before flight use.
        contact_filter_time_constant: 0.03
        admittance_filter_time_constant: 0.08

        contact_on_sigma_multiplier: 5.0
        contact_off_sigma_multiplier: 2.5
        contact_on_min_torque: 0.03       # Nm; tune from bags
        contact_off_min_torque: 0.015     # Nm; tune from bags
        contact_on_duration: 0.15         # s
        contact_off_duration: 0.30        # s
        recontact_on_duration: 0.15       # s

        authority_ramp_up_time: 0.30      # s

        # Must be verified experimentally with a small safe pitch command
        # before cutting: +1 means positive pitch offset relieves load,
        # -1 means negative pitch offset relieves load.
        relief_pitch_sign: -1.0
        penetration_torque_ratio: 0.0
        directional_deadband_sigma_multiplier: 2.0
        directional_deadband_min_torque: 0.01     # Nm; tune from bags

        recovery_angle_epsilon: 0.002     # rad
        recovery_rate_epsilon: 0.01       # rad/s

        hard_residual_pivot_torque_limit: 0.80
        cutting_active_timeout: 0.30
        max_control_dt: 0.10
        max_tare_torque_stddev: 0.06
        abort_request_topic: perching/hybrid/abort_request
        hold_relief_target_on_measurement_fault: true
