aerial_robot_control_name: aerial_robot_control/gimbalrotor_interaction_controller

controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc: true

  # The old PoseLinearController observer must stay disabled. The new observer
  # is inside InteractionController and is called synchronously by the
  # GimbalrotorInteractionController.
  wrench_estimate_flag: false

  xy:
    p_gain: 10.0
    i_gain: 0.2
    d_gain: 7.0
    limit_sum: 4.0
    limit_p: 12.0
    limit_i: 5.0
    limit_d: 12.0

  z:
    p_gain: 10.0
    i_gain: 2.0
    d_gain: 5.0
    limit_err_p: 1.0
    limit_sum: 25.0
    limit_p: 25.0
    limit_i: 20.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll:
    p_gain: 17.0
    i_gain: 0.5 # or 0.3
    d_gain: 10.0
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 0.6
    limit_d: 20.0

  pitch:
    p_gain: 15.0
    i_gain: 0.0
    d_gain: 7.0
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 10.0
    limit_d: 20.0
    start_rp_integration_height: 0.15

  yaw:
    p_gain: 15.0
    i_gain: 1.0
    d_gain: 6.0
    limit_err_p: 0.4
    limit_sum: 20.0
    limit_p: 20.0
    limit_i: 5.0
    limit_d: 20.0
    need_d_control: true

  interaction:
    # admittance: estimated wrench -> constrained motion offset
    # impedance: pose/velocity error -> physical commanded wrench
    mode: admittance

    # Full topic: /gimbalrotor/cutting_enable
    enable_topic: cutting_enable

    # world or cog. Perching always uses its own constraint frame.
    compliance_frame: world

    # Free-flight interaction is disabled in this first configuration.
    # During perching, this is replaced by the navigator's explicit
    # perching_constraint_allowed_dof.
    free_flight_active_dof: [0, 0, 0, 0, 0, 0]

    observer:
      enabled: true
      only_in_hover_land: true
      gain: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0]
      maximum_dt: 0.1

    admittance:
      # [x, y, z, roll, pitch, yaw]
      virtual_mass: [5.0, 5.0, 5.0, 0.08, 0.08, 0.08]
      damping: [50.0, 50.0, 50.0, 0.5, 0.5, 0.5]
      stiffness: [100.0, 100.0, 100.0, 1.0, 1.0, 1.0]

      reference_wrench: [0, 0, 0, 0, 0, 0]
      wrench_error_limit: [3.0, 3.0, 3.0, 0.8, 0.2, 0.8]

      position_offset_limit: [0.05, 0.05, 0.05, 0.15, 0.05236, 0.15]
      velocity_offset_limit: [0.10, 0.10, 0.10, 0.50, 0.30, 0.50]
      acceleration_offset_limit: [5.0, 5.0, 5.0, 5.0, 3.0, 5.0]

      wrench_filter_time_constant: 0.03
      maximum_dt: 0.1

    # Included now so the generic module already supports actual impedance.
    # For a pure impedance flight test, corresponding pose PID gains should be
    # reduced/zeroed because PID otherwise acts in parallel.
    impedance:
      inertia: [5.0, 5.0, 5.0, 0.08, 0.08, 0.08]
      damping: [35.0, 35.0, 35.0, 0.3, 0.3, 0.3]
      stiffness: [25.0, 25.0, 25.0, 0.8, 0.8, 0.8]
      wrench_limit: [3.0, 3.0, 3.0, 0.8, 0.8, 0.8]
      use_inertia_feedforward: true
