# bringup.launch loads flight first, then only the selected perching overlay.
# YAML merge defaults hold the anchors; the explicit empty profiles map keeps
# unselected sections out of the ROS parameter tree.
<<:
  - profiles:
      flight: &flight
        # Flight gains retained; perching uses the same signed pitch law as the hardware profile.
        aerial_robot_control_name: aerial_robot_control/gimbalrotor_controller
        controller:
          torque_allocation_matrix_inv_pub_interval: 0.05
          wrench_allocation_matrix_pub_interval: 0.1
          gimbal_calc_in_fc: false
          wrench_estimate_flag: true
          compensate_multilink_inertia: true
          inertia_dot_lpf_rate: 0.15
          nonlinear_ang_acc_limit: 5.0
          xy:
            p_gain: 2.0
            i_gain: 0.05
            d_gain: 1.5
            limit_sum: 4.0
            limit_p: 12.0
            limit_i: 12.0
            limit_d: 12.0
          z:
            p_gain: 5.0
            i_gain: 1.0
            d_gain: 2.5
            limit_err_p: 1.0
            limit_sum: 25.0
            limit_p: 25.0
            limit_i: 25.0
            limit_d: 25.0
            force_landing_descending_rate: -0.5
          roll:
            p_gain: 15.0
            i_gain: 1.0
            d_gain: 10.0
            limit_sum: 20.0
            limit_p: 20.0
            limit_i: 20.0
            limit_d: 20.0
          pitch:
            p_gain: 15.0
            i_gain: 1.0
            d_gain: 10.0
            limit_sum: 20.0
            limit_p: 20.0
            limit_i: 20.0
            limit_d: 20.0
            start_rp_integration_height: 0.01
          yaw:
            p_gain: 5.0
            i_gain: 1.0
            d_gain: 4.0
            limit_err_p: 0.4
            limit_sum: 20.0
            limit_p: 20.0
            limit_i: 20.0
            limit_d: 20.0
            need_d_control: true

      # These integer init values were also present in hardware profiles.
      init_pitch_only: &init_pitch_only
        servo_controller:
          joints:
            controller1: &joint_init
              simulation:
                init_value: 0

      init_active_pitch_roll: &init_active_pitch_roll
        servo_controller:
          joints: &two_joint_init
            controller1: *joint_init
            controller2: *joint_init
      init_active_pitch_yaw: &init_active_pitch_yaw
        <<: *init_active_pitch_roll
      init_roll_yaw: &init_roll_yaw
        <<: *init_active_pitch_roll

      articulated: &articulated
        # Verified simulation effort contract; no hardware actuator IDs are introduced.
        navigation:
          perching:
            dynamics:
              joint_effort_contract: joint_side_actuation_nm
              joint_effort:
                source: gazebo_ode_joint_states
                topic: joint_states
                producer: /gazebo
                units: Nm
                sign: urdf

      sim_pitch_only: &sim_pitch_only
        <<: [*init_pitch_only, *articulated]
      sim_active_pitch_roll: &sim_active_pitch_roll
        <<: [*init_active_pitch_roll, *articulated]
      sim_active_pitch_yaw: &sim_active_pitch_yaw
        <<: *sim_active_pitch_roll
      sim_roll_yaw: &sim_roll_yaw
        <<: *articulated
        servo_controller:
          joints:
            <<: *two_joint_init
            simulation:
              pid: {p: 20.0, i: 0.0, d: 0.5}

  - *$(arg beetle_control_section)
profiles: {}
