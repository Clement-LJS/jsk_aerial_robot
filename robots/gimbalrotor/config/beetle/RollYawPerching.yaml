# Fixed-contact capture, manual increments and explicit automatic trajectories. All angles are radians; lengths metres; times seconds.
# Confirmed hinge geometry; execution still requires an explicit perching lock.
controller:
  # Preserve Spinal attitude feedback and FC-side gimbal/motor allocation.
  # Host yaw PID consumes target rate; FourAxisCommand has no separate rate field.
  gimbal_calc_in_fc: true
navigation:
  perching_enable: false
  roll_yaw_perching:
    roll_joint: joint_roll
    yaw_joint: joint_yaw
    contact_link: roll_hand_link
    joint_state_topic: joint_states
    joint_command_topic: joints_ctrl
    body_state_topic: uav/baselink/odom
    world_frame: world
    # body_frame defaults to the URDF baselink resolved with tf_prefix (beetle: fc).
    debug_prefix: perching/roll_yaw

    # Confirmed T_CP relative to roll_hand_link, including the additional 9 mm.
    pivot_offset: [0.21049, 0.0, 0.0205]
    pivot_rpy: [0.0, 0.0, 0.0] # ZYX rotation of P relative to C
    hinge_axis: [0.0, 1.0, 0.0] # signed UNIT axis expressed in P

    # Coordinate order: [passive alpha, active roll, active yaw].
    # Active limits are intersected with URDF limits/rates; never widened.
    position_lower: [-1.2, -1.57079632679, -1.57079632679]
    position_upper: [1.2, 1.57079632679, 1.57079632679]
    velocity_caps: [0.15, 0.1, 0.1]
    acceleration_caps: [0.1, 0.1, 0.1]
    # Dedicated WORLD body-Z tilt envelope, independent of free-flight limits.
    # Kinematic planning only; this does not certify physical flight feasibility.
    body_max_tilt: 0.9
    planning_dt: 0.02
    orientation_tolerance: 0.003
    rate_tolerance: 0.01
    alignment_rate: 0.04
    alignment_acceleration: 0.02
    max_phase_duration: 180.0
    scaling_attempts: 5
    cog_speed_limit: 0.1
    cog_acceleration_limit: 0.2
    qp_weights: [1.0, 1.0, 1.0]
    qp_regularization: 0.00000001
    qp_smoothing: 0.000001
    orientation_gain: 2.0
    min_singular_value: 0.05
    feedback_timeout: 0.15
    future_tolerance: 0.02
    feedback_sync_tolerance: 0.05
    pivot_tolerance: 0.01
    hinge_residual_tolerance: 0.03
    tracking_tolerance: 0.04
    body_tracking_tolerance: 0.04
    cog_model_tolerance: 0.005
    # Enable captures measured configuration; endpoint settling stays separate.
    require_settled_on_enable: false
    settle_rate: 0.01
    settle_time: 0.5
    settle_timeout: 10.0
    # manual_delta: Vector3Stamped, x=roll/y=local pitch/z=yaw increments [rad].
    # frame_id=perching_lock_<session>, strictly increasing fresh ROS stamp;
    # exactly one nonzero axis; all-zero vector cancels/decelerates and holds.
    manual_max_step: 0.00872664626 # 0.5 degrees; hard implementation ceiling 1 degree
    manual_command_timeout: 0.25
    # Manual tracking bound, not an endpoint settling requirement. Checked for
    # both the held target and the proposed endpoint against fresh measurements.
    # 0.03 rad (1.72 deg) accommodates the recorded hold error while remaining
    # below BOTH execution tracking limits (0.04 rad). One increment at a time.
    manual_tracking_tolerance: 0.03
    request:
      # Only explicit prepare/align/start use this automatic request.
      # Relative to N = measured body orientation at this contact lock.
      body_yaw: 0.523598775598
      body_roll: 0.0
      pitch_start: 0.0
      pitch_end: 0.349065850399
      pitch_rate: 0.03          # positive magnitude; direction from end-start
      pitch_acceleration: 0.02
