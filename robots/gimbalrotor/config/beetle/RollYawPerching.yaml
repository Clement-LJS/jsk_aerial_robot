# Configured coordinates are [alpha, active_joints...]; all geometry except the external hinge comes from URDF.
# Servo mappings retain the existing hardware IDs/signs. Hinge calibration and tuning require hardware verification.
controller:
  gimbal_calc_in_fc: true
  command_wrench_topic: perching/roll_yaw/command_wrench_estimate
  admittance:
    inertia_pitch: 0.4
    rot_damping_pitch: 5.0
    rot_stiffness_pitch: 4.5
    torque_limit_pitch: 0.18
    angle_offset_limit_pitch: 0.0383972
    angular_vel_offset_limit_pitch: 0.15
    enable_pitch: 1.0
    torque_ref_pitch: 0.0
    perching:
      equilibrium_wrench_required_samples: 80
      contact_on_threshold: 0.04
      contact_off_threshold: 0.02
      contact_on_duration: 0.1
      contact_off_duration: 0.2
      pitch_acceleration_limit: 0.1
navigation:
  perching_enable: false
  perching:
    body_pitch_jog_max_delta: 0.0174532925199433
    body_pitch_velocity_command_duration: 8.0
    max_execution_step: 0.05
    max_execution_gap: 0.15
    observer_max_interval: 0.15
    dynamics:
      observer_gain: 10.0
      joint_effort:
        source: servo_bridge_joint_states
        topic: joint_states
    pitch_rezero_target_pitch: 0.0
    pitch_rezero_kp: 1.0
    pitch_rezero_command_sign: -1.0
    pitch_rezero_rate_limit: 0.1745329
    pitch_rezero_max_delta: 0.5235988
    pitch_rezero_pitch_tolerance: 0.0349066
    pitch_rezero_rate_tolerance: 0.05
    pitch_rezero_stable_duration: 0.3
    pitch_rezero_timeout: 5.0
    contact_link: roll_hand_link
    joint_state_topic: joint_states
    joint_command_topic: joints_ctrl
    body_state_topic: uav/baselink/odom
    world_frame: world
    debug_prefix: perching/roll_yaw
    pivot_offset:
    - 0.21049
    - 0.0
    - 0.0205
    pivot_rpy:
    - 0.0
    - 0.0
    - 0.0
    hinge_axis:
    - 0.0
    - 1.0
    - 0.0
    position_lower:
    - -1.2
    - -1.57079632679
    - -1.57079632679
    position_upper:
    - 1.2
    - 1.57079632679
    - 1.57079632679
    velocity_caps:
    - 0.15
    - 0.1
    - 0.1
    acceleration_caps:
    - 0.1
    - 0.1
    - 0.1
    body_max_tilt: 0.9
    cog_speed_limit: 0.1
    cog_acceleration_limit: 0.2
    feedback_timeout: 0.15
    future_tolerance: 0.02
    feedback_sync_tolerance: 0.05
    tracking_tolerance: 0.04
    body_tracking_tolerance: 0.04
    request:
      pitch_increment: 0.349065850399
      pitch_rate: 0.03
      pitch_acceleration: 0.02
    active_joints:
    - joint_roll
    - joint_yaw
    pitch_coordinates:
    - alpha
    - joint_roll
    - joint_yaw
    manual_coordinate: alpha
    wire_coordinates:
      '0': alpha
      '1': joint_roll
      '2': joint_yaw
    wire_angles:
    - joint_roll
    - alpha
    - joint_yaw
    diagnostic_name: roll_yaw_perching
    coordinate_topics:
      perching/roll_yaw/alpha_target: alpha
      perching/roll_yaw/roll_target: joint_roll
      perching/roll_yaw/yaw_target: joint_yaw
    pitch_rate: 0.03
    pitch_acceleration: 0.02
  roll_yaw_perching: {}
servo_controller:
  joints:
    controller1:
      id: 6
      name: joint_yaw
      angle_sgn: -1
      simulation:
        init_value: 0
    controller2:
      id: 7
      name: joint_roll
      angle_scale: 0.001534
      simulation:
        init_value: 0
