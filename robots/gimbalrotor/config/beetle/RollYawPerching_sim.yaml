# Gazebo-only overrides, loaded after RollYawPerching.yaml and Servo.yaml.
navigation:
  roll_yaw_perching:
    dynamics:
      # Explicit SIMULATION-ONLY contract for the shipped Gazebo ODE world,
      # AerialRobotHWSim/DefaultRobotHWSim + effort-controlled roll/yaw joints +
      # JointStateController. ODE GetForce reports saved limited SetForce torque
      # in Nm in the URDF axis, not joint reaction or a PID target. No conversion.
      # Other physics engines, plugins and external torque writers are unsupported.
      # Runtime also requires /use_sim_time, matching controller/plugin and callerid.
      # This does NOT select articulated admittance: legacy_wrench remains default.
      joint_effort_contract: joint_side_actuation_nm
      joint_effort:
        source: gazebo_ode_joint_states
        topic: joint_states
        producer: /gazebo # change only if the same verified Gazebo node is renamed
        units: Nm
        sign: urdf
    # Orientation path endpoint settling only; enable/relock capture without a rate gate.
    # Stationary simulated IMU rate noise exceeds the hardware 0.01 rad/s value.
    settle_use_window: false # Retain continuous strict settling in Gazebo.
    settle_rate: 0.08
servo_controller:
  joints:
    simulation:
      # The attached body loads these joints. The free-hand P=5 controller
      # exceeds the 0.04 rad tracking limit during combined yaw/roll alignment.
      # Preserve URDF effort/rate limits and all hardware servo settings.
      pid: {p: 20.0, i: 0.0, d: 0.5}
