servo_controller:
 gimbals:
   angle_sgn: 1
   angle_scale: 0.001534  # 2*pi/4096  DynamixelServo
   zero_point_offset: 2047

   controller1:
     id: 0
     name: gimbal1
     simulation:
       pid: {p: 5.0, i: 0.1, d: 0.1, i_clamp_max: 2.0, i_clamp_min: -2.0}
       init_value: 0
       type: effort_controllers/JointPositionController

   controller2:
     id: 1
     name: gimbal2
     simulation:
       pid: {p: 5.0, i: 0.1, d: 0.1, i_clamp_max: 2.0, i_clamp_min: -2.0}
       init_value: 0
       type: effort_controllers/JointPositionController

   controller3:
     id: 2
     name: gimbal3
     simulation:
       pid: {p: 5.0, i: 0.1, d: 0.1, i_clamp_max: 2.0, i_clamp_min: -2.0}
       init_value: 0
       type: effort_controllers/JointPositionController

   controller4:
     id: 3
     name: gimbal4
     simulation:
       pid: {p: 5.0, i: 0.1, d: 0.1, i_clamp_max: 2.0, i_clamp_min: -2.0}
       init_value: 0
       type: effort_controllers/JointPositionController


   # for low pass filter
   filter_flag: true
   sample_freq: 50.0 # 50Hz
   cutoff_freq: 10.0 # 10Hz, test

   # for simulation
   simulation:
     pid: {p: 50.0, i: 0.01, d: 2.0}
     init_value: 0.0
     type: effort_controllers/JointPositionController

   controller1:
     id: 4
     name: joint_pitch
     simulation:
       init_value: 0

   controller2:
     id: 5
     name: joint_yaw
     simulation:
       init_value: 0
