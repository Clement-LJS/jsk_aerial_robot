# Teleop Basic Param

navigation:
  xy_control_mode: 0
  # World Pos Control Mode: 0
  # World Vel Control Mode: 2
  # Local Vel Control Mode: 3
  # Attitude Control Mode: 4


  takeoff_height: 0.6 #1.0
  outdoor_takeoff_height: 1.5

  # teleop operation
  max_target_vel: 0.5
  joy_target_vel_interval: 0.005  # 0.2 / 20 = 0.01, 0.005 ~ 0.01  m/s
  joy_target_z_interval: 0.02
  max_target_yaw_rate: 0.1 #  0.05
  teleop_local_frame: fc

  cmd_vel_lev2_gain : 2.0
  # nav_vel_limit : 0.2
  # vel_nav_threshold : 0.01

  gain_tunning_mode: 0
  max_target_tilt_angle: 0.2
  cmd_angle_lev2_gain : 1.5

  # gps waypoint
  gps_waypoint_threshold: 3.0
  gps_waypoint_check_du: 1.0

  # desire tilt
  baselink_rot_pub_interval: 0.1
  baselink_rot_change_thresh: 0.02 #1.0 # 0.2 hz -> 0.04; 0.01 hz-> 0.02


  # gimbalrotor_multilink related	 
  joint_cmd_pub_interval: 0.02
  pitch_joint_name: "pitch_joint"

  # Usually -1.0.
  # If the hand tilts more instead of staying horizontal, change to +1.0.
  pitch_joint_compensation_sign: 1.0

  # Offset if your mechanical zero is not perfectly horizontal.
  pitch_joint_offset: 0.0

  # Joint safety limit in rad.
  pitch_joint_limit: 1.57

  # During takeoff, pitch joint should be zero.
  takeoff_pitch_joint_angle: 0.0

  # Landing / halt safety shape.
  landing_pitch_joint_angle: 0.0

  # About 4.9 deg.
  pitch_joint_land_thresh: 0.085

  # Enable automatic hand-horizontal compensation.
  keep_hand_horizontal: true

  # ================================
  # New parameters
  # ================================

  # Limit how fast the pitch joint command can change.
  # This prevents the hand servo from moving much faster than the drone body.
  pitch_joint_max_velocity: 0.25   # [rad/s] start slow, tune later

  # Low-pass filter for pitch joint command.
  # 0.0 = do not move, 1.0 = no filtering.
  # Start with 0.15 ~ 0.30.
  pitch_joint_lpf_rate: 0.2

  # If true, use estimated actual body pitch.
  # If false, use commanded target body pitch.
  # Recommended first test: true.
  pitch_joint_use_estimated_body_pitch: false

  # Cutting compliance is added around horizontal compensation,
  # not replacing it.
  use_pitch_joint_compliance_in_cutting: false

  # Limit small offset around stable hand-horizontal posture.
  pitch_joint_compliance_offset_limit: 0.0

  # Set nonzero only if branch is not horizontal.
  branch_alignment_offset: 0.0

  # Deprecated for fixed-hand cutting mode.
  # Cutting pitch motion should come from baselink/body RPY command, 
  # not from pitch-joint offset, otherwise hand orientation changes.
  cutting_feed_offset: 0.0

  ############################# PERCHING NAV #############################
  perching_enable: false
  perching_lock_once: true
  perching_command_pitch_as_delta: true
  perching_constrain_position_command: true
  perching_constrain_velocity_command: true
  perching_use_pitch_command_for_arc: true
  perching_hold_locked_pose_without_pitch_command: true
  perching_min_valid_radius: 0.05
  perching_max_pitch_delta: 0.5235987756
  perching_arc_pitch_sign: 1.0
  perching_command_pitch_sign: 1.0
  perching_enable_topic: "perching/enable"
  perching_branch_pose_topic: "perching/branch_pose"
  perching_point_topic: "perching/point"
  perching_relock_topic: "perching/relock"
  perching_reset_topic: "perching/reset"
  perching_active_hold_enable: true
  perching_y_compliance_deadband: 0.03
  perching_takeoff_target_pitch_frame: world
  perching_takeoff_target_pitch: 0.0
  perching_takeoff_pitch_command_rate: 0.1745329252
  perching_takeoff_max_pitch_delta: 1.57079632679
  perching_takeoff_pitch_tolerance: 0.0872664626
  perching_takeoff_pitch_rate_tolerance: 0.15
  perching_takeoff_stable_duration: 0.30
  perching_servo_neutral_settle_duration: 0.8
  perching_takeoff_timeout: 8.0
  perching_landing_descend_vel: -0.05
  perching_accept_uav_nav_pitch_command: false
  perching_manual_pitch_delta_topic: perching/manual_pitch_delta
  perching_pivot_source: manual
  perching_require_branch_point: false
  hand_perching_center_offset_baselink_x: -0.33568
  hand_perching_center_offset_baselink_y: 0.0
  hand_perching_center_offset_baselink_z: 0.017
  perching_locked_pivot_topic: perching/locked_pivot
  perching_servo_neutral_mode_topic: perching/servo_neutral_mode

  ################ EXTERNAL PERCHING PITCH JOINT ################
  perching_pitch_joint_enable: true
  perching_pitch_joint_name: pitch_joint
  perching_center_link_name: perching_center
  perching_pitch_joint_command_topic: joints_ctrl
  perching_pitch_joint_target_topic: perching/pitch_joint/target
  perching_pitch_joint_ready_topic: perching/pitch_joint/ready
  perching_pitch_joint_locked_angle_topic: perching/pitch_joint/locked_angle
  perching_constraint_valid_topic: perching/constraint_valid
  perching_pitch_joint_min: -1.57
  perching_pitch_joint_max: 1.57
  perching_pitch_joint_max_velocity: 0.1
  perching_pitch_joint_command_pub_interval: 0.02
  perching_pitch_joint_position_tolerance: 0.03
  perching_pitch_joint_velocity_tolerance: 0.02
  perching_pitch_joint_stable_duration: 0.30
  perching_pitch_joint_drift_tolerance: 0.05
