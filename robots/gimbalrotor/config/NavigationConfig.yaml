# Teleop Basic Param

navigation:
  xy_control_mode: 0

  takeoff_height: 0.3
  outdoor_takeoff_height: 1.5

  max_target_vel: 0.5
  joy_target_vel_interval: 0.005
  joy_target_z_interval: 0.02
  max_target_yaw_rate: 0.1
  teleop_local_frame: fc

  cmd_vel_lev2_gain: 2.0
  gain_tunning_mode: 0
  max_target_tilt_angle: 0.2
  cmd_angle_lev2_gain: 1.5

  gps_waypoint_threshold: 3.0
  gps_waypoint_check_du: 1.0

  baselink_rot_pub_interval: 0.2
  baselink_rot_change_thresh: 1.0

  ######################## PERCHING CONSTRAINT ########################
  perching_enable: false
  perching_lock_once: true
  perching_active_hold_enable: true

  # Current implementation: exactly one rotational DOF must be selected.
  # [translation x, y, z, rotation x, y, z]
  # Current pitch-like constraint:
  perching_constraint_allowed_dof: [0, 0, 0, 0, 1, 0]

  # Orientation of the constraint frame in world, [roll, pitch, yaw] rad.
  # Identity means its Y axis is world Y.
  perching_constraint_frame_rpy: [0.0, 0.0, 0.0]

  # Change to -1 if positive q rotates in the physically wrong direction.
  perching_constraint_coordinate_sign: 1.0
  perching_command_sign: 1.0

  # Maximum absolute q from the locked pose [rad].
  perching_max_constraint_angle: 0.5235987756
  perching_min_valid_radius: 0.05

  # true: incoming target angle is q relative to the locked pose.
  # false: incoming target angle is an absolute roll/pitch/yaw angle.
  perching_command_angle_as_delta: true

  # Keep false when a mission helper repeatedly publishes zero attitude.
  perching_accept_uav_nav_angle_command: false

  # manual: base_link + configured hand-center offset
  # branch: perching/point, otherwise perching/branch_pose
  perching_pivot_source: manual

  hand_perching_center_offset_baselink_x: -0.33568
  hand_perching_center_offset_baselink_y: 0.00193
  hand_perching_center_offset_baselink_z: 0.08000

  perching_enable_topic: perching/enable
  perching_relock_topic: perching/relock
  perching_reset_topic: perching/reset
  perching_branch_pose_topic: perching/branch_pose
  perching_point_topic: perching/point

  # Generic names.
  perching_target_angle_topic: perching/target_angle_deg
  perching_add_angle_topic: perching/add_angle_deg

  # Compatibility aliases for your current mission/keyboard tools.
  perching_target_pitch_topic: perching/target_pitch_deg
  perching_add_pitch_topic: perching/add_pitch_deg
  perching_manual_pitch_delta_topic: perching/manual_pitch_delta
